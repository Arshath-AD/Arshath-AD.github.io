  <!-- ── Critical: preconnect to external origins ────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <!-- ── LCP Hero Image Preload (highest priority) ────────── -->
  <!-- Tells browser to start fetching the WebP hero image immediately,
       before React even mounts, eliminating the LCP bottleneck. -->
  <link rel="preload" as="image" type="image/webp"
    href="/assets/images/avatar-720.webp"
    imagesrcset="/assets/images/avatar-300.webp 300w, /assets/images/avatar-720.webp 720w"
    imagesizes="(max-width: 640px) 136px, 352px"
    fetchpriority="high" />

  <!-- ── Google Fonts: non-render-blocking via print trick ── -->
  <!-- Load fonts as print stylesheet (doesn't block render),
       then switch to 'all' once loaded. display=swap prevents FOIT. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=Fredoka:wght@400;600&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'" />
  <!-- Noscript fallback for users with JS disabled -->
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=Fredoka:wght@400;600&display=swap"
      rel="stylesheet" />
  </noscript>

  <!-- ── Devicon: loaded async (non-critical) ──────────────── -->
  <!-- Loaded after LCP via JS to avoid blocking initial render -->
  <script>
    // Defer Devicon load until after page is interactive
    // This prevents it from blocking LCP and FCP
    function loadDevicon() {
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.type = 'text/css';
      link.href = 'https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css';
      document.head.appendChild(link);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        requestIdleCallback ? requestIdleCallback(loadDevicon) : setTimeout(loadDevicon, 100);
      });
    } else {
      requestIdleCallback ? requestIdleCallback(loadDevicon) : setTimeout(loadDevicon, 100);
    }
  </script>
